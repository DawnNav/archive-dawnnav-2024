<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>WebStack 多语言管理器</title>
    <style>
        :root {
            --bg: #eef2ff;
            --bg-2: #f8fafc;
            --panel: rgba(255, 255, 255, 0.9);
            --line: #dbe3f0;
            --text: #0f172a;
            --muted: #64748b;
            --blue: #2563eb;
            --green: #059669;
            --red: #dc2626;
            --amber: #d97706;
            --shadow: 0 18px 45px rgba(15, 23, 42, 0.10);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.14), transparent 30%),
                radial-gradient(circle at top right, rgba(16, 185, 129, 0.12), transparent 26%),
                linear-gradient(180deg, var(--bg), var(--bg-2));
            color: var(--text);
            font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }
        .admin-shell {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px 20px 32px;
        }
        .header {
            position: sticky;
            top: 16px;
            z-index: 100;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(18px);
            box-shadow: var(--shadow);
        }
        .brand { display: flex; flex-direction: column; gap: 6px; }
        .eyebrow {
            font-size: 12px;
            letter-spacing: 0.08em;
            color: var(--muted);
            text-transform: uppercase;
            font-weight: 700;
        }
        .brand h2 { margin: 0; font-size: 22px; }
        .status-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--muted);
        }
        .chip strong { color: var(--text); }
        .chip.ok { color: var(--green); }
        .chip.warn { color: var(--amber); }
        .chip.dirty { color: var(--red); }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }
        .search-input,
        .file-select,
        .taxonomy-input,
        input[type="text"] {
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
            color: var(--text);
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
        }
        .search-input:focus,
        .file-select:focus,
        .taxonomy-input:focus,
        input[type="text"]:focus {
            border-color: rgba(37, 99, 235, 0.5);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
        }
        .search-input {
            min-width: 280px;
            padding: 10px 14px;
            font-size: 14px;
        }
        .file-select {
            padding: 10px 12px;
            font-size: 14px;
            min-width: 230px;
            cursor: pointer;
        }
        .btn {
            cursor: pointer;
            padding: 10px 14px;
            border: 0;
            border-radius: 12px;
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.01em;
            transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.10);
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); opacity: 0.92; }
        .btn-save { background: linear-gradient(135deg, var(--green), #047857); }
        .btn-add { background: linear-gradient(135deg, var(--blue), #1d4ed8); }
        .btn-del { background: linear-gradient(135deg, var(--red), #b91c1c); font-size: 12px; padding: 7px 10px; box-shadow: none; }
        .btn-ghost {
            background: #fff;
            color: var(--text);
            border: 1px solid var(--line);
            box-shadow: none;
        }
        .btn-ghost:hover { background: #f8fafc; }
        .body-area {
            padding-top: 18px;
        }
        .summary-bar {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin: 18px 0;
        }
        .summary-card {
            padding: 14px 16px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.76);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }
        .summary-card .label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 4px;
        }
        .summary-card .value {
            font-size: 18px;
            font-weight: 800;
            color: var(--text);
        }
        .container-box {
            background: var(--panel);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.78);
            box-shadow: var(--shadow);
        }
        .container-box.hidden { display: none; }
        .taxonomy-header {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line);
        }
        .taxonomy-header > span {
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }
        .taxonomy-input {
            font-size: 16px;
            font-weight: 800;
            padding: 10px 12px;
            min-width: 220px;
        }
        .link-item {
            display: flex;
            gap: 10px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 16px;
            align-items: center;
            background: #fff;
            margin-bottom: 10px;
        }
        .link-item:hover { border-color: rgba(37, 99, 235, 0.25); }
        .input-group { display: flex; flex-direction: column; flex: 1; gap: 8px; }
        .input-row { display: flex; gap: 10px; flex-wrap: wrap; }
        input[type="text"] { padding: 9px 11px; }
        .inp-title { width: 180px; font-weight: 700; }
        .inp-url { flex: 1; color: #475569; font-family: Consolas, "SFMono-Regular", monospace; min-width: 220px; }
        .inp-desc { width: 100%; color: #64748b; font-size: 0.95em; }
        .sub-group {
            margin-left: 18px;
            border-left: 3px solid #dbeafe;
            padding-left: 14px;
            margin-top: 14px;
        }
        .term-header {
            font-weight: 800;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #334155;
            flex-wrap: wrap;
        }
        .term-header input[type="text"] { min-width: 220px; }
        .empty-state, .loading-state, .error-state {
            padding: 40px 20px;
            text-align: center;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px dashed var(--line);
            color: var(--muted);
        }
        .error-state { color: var(--red); }
        .footer-note {
            margin-top: 18px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
        }
        @media (max-width: 1100px) {
            .summary-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .search-input { min-width: 180px; flex: 1 1 220px; }
            .file-select { min-width: 180px; }
        }
        @media (max-width: 720px) {
            .admin-shell { padding: 12px; }
            .header { padding: 14px; border-radius: 18px; }
            .summary-bar { grid-template-columns: 1fr; }
            .toolbar { width: 100%; justify-content: stretch; }
            .toolbar > * { width: 100%; }
            .btn { width: 100%; }
            .link-item { align-items: stretch; }
            .btn-del { width: auto; }
        }
    </style>
</head>
<body>

    <div class="admin-shell">
        <div class="header">
            <div class="brand">
                <div class="eyebrow">WebStack Admin</div>
                <h2>📚 数据管理中心</h2>
                <div class="status-row" id="statusRow">
                    <span id="fileBadge" class="chip ok">当前文件：<strong>CN</strong></span>
                    <span id="saveBadge" class="chip">状态：<strong>已保存</strong></span>
                    <span id="countBadge" class="chip">链接：<strong>0</strong></span>
                </div>
            </div>

            <div class="toolbar">
                <input id="searchInput" class="search-input" type="search" placeholder="搜索分类、子分类、标题、网址、描述" oninput="applyFilter(this.value)">
                <select id="fileSelector" class="file-select" onchange="switchFile(this.value)">
                    <option value="cn">🇨🇳 中文主站 (webstack.yml)</option>
                    <option value="en">🇺🇸 English Site (en.md)</option>
                </select>
                <button class="btn btn-ghost" onclick="refreshData()">↻ 刷新</button>
                <button class="btn btn-add" onclick="addNewTaxonomy()">+ 新增分类</button>
                <button id="saveButton" class="btn btn-save" onclick="saveData()">💾 保存</button>
            </div>
        </div>

        <div class="summary-bar">
            <div class="summary-card">
                <span class="label">分类</span>
                <span class="value" id="taxonomyCount">0</span>
            </div>
            <div class="summary-card">
                <span class="label">子分类</span>
                <span class="value" id="termCount">0</span>
            </div>
            <div class="summary-card">
                <span class="label">链接总数</span>
                <span class="value" id="linkCount">0</span>
            </div>
            <div class="summary-card">
                <span class="label">筛选结果</span>
                <span class="value" id="visibleCount">0</span>
            </div>
        </div>

        <div id="app" class="body-area">
            <div class="loading-state">正在加载数据...</div>
        </div>

        <div class="footer-note">快捷键：Ctrl / ⌘ + S 保存，Esc 清空搜索。</div>
    </div>

    <script>
        let globalData = [];
        let currentFileKey = 'cn'; // 默认为中文
        let dirty = false;
        let searchQuery = '';
        let lastSavedSnapshot = '';
        let currentCounts = { totalTaxonomies: 0, totalTerms: 0, totalLinks: 0, visibleItems: 0 };

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function setDirtyState(isDirty) {
            dirty = isDirty;
            const saveBadge = document.getElementById('saveBadge');
            const saveButton = document.getElementById('saveButton');
            if (saveBadge) {
                saveBadge.className = `chip ${dirty ? 'dirty' : 'ok'}`;
                saveBadge.innerHTML = dirty ? '状态：<strong>未保存</strong>' : '状态：<strong>已保存</strong>';
            }
            if (saveButton) {
                saveButton.textContent = dirty ? '💾 保存*' : '💾 保存';
            }
        }

        function updateFileBadge() {
            const fileBadge = document.getElementById('fileBadge');
            if (!fileBadge) return;
            const label = currentFileKey === 'cn' ? 'CN' : 'EN';
            fileBadge.innerHTML = `当前文件：<strong>${label}</strong>`;
        }

        function updateSummary(counts) {
            const visibleCount = counts.visibleItems ?? 0;
            document.getElementById('taxonomyCount').textContent = counts.totalTaxonomies ?? 0;
            document.getElementById('termCount').textContent = counts.totalTerms ?? 0;
            document.getElementById('linkCount').textContent = counts.totalLinks ?? 0;
            document.getElementById('visibleCount').textContent = visibleCount;
            document.getElementById('countBadge').innerHTML = `链接：<strong>${counts.totalLinks ?? 0}</strong>`;
        }

        function markDirty() {
            if (!dirty) setDirtyState(true);
        }

        function snapshotData() {
            return JSON.stringify(globalData);
        }

        function syncSnapshot() {
            lastSavedSnapshot = snapshotData();
            setDirtyState(false);
        }

        function isSnapshotDirty() {
            return snapshotData() !== lastSavedSnapshot;
        }

        function getCounts(data) {
            const counts = { totalTaxonomies: 0, totalTerms: 0, totalLinks: 0 };
            if (!Array.isArray(data)) return counts;
            counts.totalTaxonomies = data.length;
            data.forEach((tax) => {
                if (!tax) return;
                if (Array.isArray(tax.links)) counts.totalLinks += tax.links.filter((link) => link && link.url).length;
                if (Array.isArray(tax.list)) {
                    counts.totalTerms += tax.list.length;
                    tax.list.forEach((term) => {
                        if (!term || !Array.isArray(term.links)) return;
                        counts.totalLinks += term.links.filter((link) => link && link.url).length;
                    });
                }
            });
            return counts;
        }

        function updateVisibleStats(visibleItems) {
            currentCounts.visibleItems = visibleItems;
            updateSummary(currentCounts);
        }

        window.addEventListener('beforeunload', (event) => {
            if (dirty || isSnapshotDirty()) {
                event.preventDefault();
                event.returnValue = '';
            }
        });

        window.addEventListener('keydown', (event) => {
            const isMacSave = event.metaKey && event.key.toLowerCase() === 's';
            const isWindowsSave = event.ctrlKey && event.key.toLowerCase() === 's';
            if (isMacSave || isWindowsSave) {
                event.preventDefault();
                saveData();
                return;
            }
            if (event.key === 'Escape') {
                const searchInput = document.getElementById('searchInput');
                if (searchInput && searchInput.value) {
                    searchInput.value = '';
                    applyFilter('');
                }
            }
        });

        // 初始化加载
        loadData('cn');

        // 切换文件
        function switchFile(key) {
            if ((dirty || isSnapshotDirty()) && !confirm('当前文件有未保存修改，切换文件会丢失这些改动，是否继续？')) {
                document.getElementById('fileSelector').value = currentFileKey;
                return;
            }
            currentFileKey = key;
            searchQuery = '';
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.value = '';
            updateFileBadge();
            setDirtyState(false);
            const app = document.getElementById('app');
            app.innerHTML = '<div class="loading-state">⏳ 正在切换数据文件...</div>';
            loadData(key);
        }

        function refreshData() {
            if ((dirty || isSnapshotDirty()) && !confirm('当前文件有未保存修改，刷新后会丢失这些改动，是否继续？')) {
                return;
            }
            loadData(currentFileKey);
        }

        // 加载数据
        function loadData(key) {
            updateFileBadge();
            document.getElementById('app').innerHTML = '<div class="loading-state">⏳ 正在加载数据...</div>';
            fetch(`/api/data?key=${key}`)
                .then(res => {
                    if (!res.ok) {
                        return res.json().then((payload) => {
                            throw new Error(payload?.error || `加载失败 (${res.status})`);
                        }).catch(() => {
                            throw new Error(`加载失败 (${res.status})`);
                        });
                    }
                    const totalCount = res.headers.get('X-Total-Count');
                    if (totalCount !== null) {
                        const label = key === 'cn' ? 'CN' : 'EN';
                        document.getElementById('countBadge').innerHTML = `链接：<strong>${totalCount}</strong>`;
                        document.getElementById('fileBadge').innerHTML = `当前文件：<strong>${label}</strong>`;
                    }
                    return res.json();
                })
                .then(data => {
                    globalData = data || [];
                    currentCounts = getCounts(globalData);
                    syncSnapshot();
                    render();
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('app').innerHTML = `<div class="error-state">❌ 加载失败：${escapeHtml(err.message)}</div>`;
                });
        }

        function applyFilter(value) {
            searchQuery = (value || '').trim().toLowerCase();
            render();
        }

        // 渲染主逻辑 (保持不变，只是数据源变了)
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            let visibleItems = 0;

            if (!globalData || globalData.length === 0) {
                app.innerHTML = '<div class="empty-state">当前文件为空，请点击“新增分类”开始添加内容。</div>';
                updateVisibleStats(0);
                return;
            }

            globalData.forEach((tax, taxIdx) => {
                if (!tax) return;

                const taxonomyText = `${tax.taxonomy || ''} ${tax.icon || ''}`.toLowerCase();
                const taxMatches = !searchQuery || taxonomyText.includes(searchQuery);
                const filteredLinks = Array.isArray(tax.links)
                    ? tax.links
                        .map((link, linkIdx) => ({ ...link, __index: linkIdx }))
                        .filter((link) => {
                            const blob = `${link?.title || ''} ${link?.url || ''} ${link?.description || ''}`.toLowerCase();
                            return !searchQuery || blob.includes(searchQuery);
                        })
                    : [];
                const filteredTerms = Array.isArray(tax.list)
                    ? tax.list
                        .map((termItem, termIdx) => {
                            const termText = `${termItem?.term || ''}`.toLowerCase();
                            const termLinks = Array.isArray(termItem?.links)
                                ? termItem.links
                                    .map((link, linkIdx) => ({ ...link, __index: linkIdx }))
                                    .filter((link) => {
                                        const blob = `${link?.title || ''} ${link?.url || ''} ${link?.description || ''}`.toLowerCase();
                                        return !searchQuery || blob.includes(searchQuery);
                                    })
                                : [];
                            const termMatches = !searchQuery || termText.includes(searchQuery) || termLinks.length > 0;
                            return termMatches ? { ...termItem, __index: termIdx, links: termLinks } : null;
                        })
                        .filter(Boolean)
                    : [];

                const shouldShow = !searchQuery || taxMatches || filteredLinks.length > 0 || filteredTerms.length > 0;
                if (!shouldShow) return;
                visibleItems += 1;

                const box = document.createElement('div');
                box.className = 'container-box';
                box.dataset.taxIdx = String(taxIdx);
                
                let html = `
                    <div class="taxonomy-header">
                        <span>分类:</span>
                        <input class="taxonomy-input" value="${escapeHtml(tax.taxonomy || '')}" onchange="updateTax(${taxIdx}, 'taxonomy', this.value)">
                        <span>图标:</span>
                        <input type="text" value="${escapeHtml(tax.icon || '')}" style="width:110px" placeholder="fa-icon" onchange="updateTax(${taxIdx}, 'icon', this.value)">
                        <button class="btn btn-del" onclick="delTax(${taxIdx})">删除分类</button>
                    </div>
                `;

                if (tax.links) {
                    html += `<div id="links-${taxIdx}"></div>`;
                    html += `<button class="btn btn-add" style="margin-top:10px; font-size:12px" onclick="addLink(${taxIdx}, null)">+ 添加链接</button>`;
                } else if (tax.list) {
                    html += `<div id="list-${taxIdx}"></div>`;
                    html += `<button class="btn btn-add" style="margin-top:10px; font-size:12px" onclick="addTerm(${taxIdx})">+ 添加子分类</button>`;
                } else {
                    html += `<button class="btn btn-add" onclick="initLinksMode(${taxIdx})">初始化为链接模式</button> 
                             <button class="btn btn-add" onclick="initListMode(${taxIdx})">初始化为子分类模式</button>`;
                }

                box.innerHTML = html;
                app.appendChild(box);

                if (tax.links) renderLinks(filteredLinks, document.getElementById(`links-${taxIdx}`), taxIdx, null);
                if (tax.list) renderTerms(filteredTerms, document.getElementById(`list-${taxIdx}`), taxIdx);
            });

            if (app.children.length === 0) {
                app.innerHTML = searchQuery
                    ? `<div class="empty-state">没有找到匹配“${escapeHtml(searchQuery)}”的内容。</div>`
                    : '<div class="empty-state">当前没有可显示的数据。</div>';
            }

            currentCounts = getCounts(globalData);
            updateSummary({ ...currentCounts, visibleItems });
            if (isSnapshotDirty()) setDirtyState(true);
        }

        function renderLinks(links, container, taxIdx, termIdx) {
            if (!Array.isArray(links)) return;
            links.forEach((link, linkIdx) => {
                if (!link) return;
                const originalLinkIdx = link.__index ?? linkIdx;
                const row = document.createElement('div');
                row.className = 'link-item';
                row.innerHTML = `
                    <div class="input-group">
                        <div class="input-row">
                            <input class="inp-title" placeholder="标题" value="${escapeHtml(link.title || '')}" oninput="updateLink(${taxIdx}, ${termIdx}, ${originalLinkIdx}, 'title', this.value)">
                            <input class="inp-url" placeholder="网址" value="${escapeHtml(link.url || '')}" oninput="updateLink(${taxIdx}, ${termIdx}, ${originalLinkIdx}, 'url', this.value)">
                        </div>
                        <input class="inp-desc" placeholder="描述" value="${escapeHtml(link.description || '')}" oninput="updateLink(${taxIdx}, ${termIdx}, ${originalLinkIdx}, 'description', this.value)">
                    </div>
                    <button class="btn btn-del" onclick="delLink(${taxIdx}, ${termIdx}, ${originalLinkIdx})">删</button>
                `;
                container.appendChild(row);
            });
        }

        function renderTerms(list, container, taxIdx) {
            if (!Array.isArray(list)) return;
            list.forEach((termItem, termIdx) => {
                if (!termItem) return;
                const originalTermIdx = termItem.__index ?? termIdx;
                const termDiv = document.createElement('div');
                termDiv.className = 'sub-group';
                termDiv.innerHTML = `
                    <div class="term-header">
                        📁 子分类: <input type="text" value="${escapeHtml(termItem.term || '')}" onchange="updateTermName(${taxIdx}, ${originalTermIdx}, this.value)">
                        <button class="btn btn-del" onclick="delTerm(${taxIdx}, ${originalTermIdx})">删除子类</button>
                    </div>
                    <div id="term-links-${taxIdx}-${originalTermIdx}"></div>
                    <button class="btn btn-add" style="font-size:12px; margin-top:5px;" onclick="addLink(${taxIdx}, ${originalTermIdx})">+ 添加链接到此组</button>
                `;
                container.appendChild(termDiv);
                renderLinks(termItem.links || [], document.getElementById(`term-links-${taxIdx}-${originalTermIdx}`), taxIdx, originalTermIdx);
            });
        }

        // --- 数据操作逻辑 ---
        function updateTax(idx, key, val) { globalData[idx][key] = val; markDirty(); render(); }
        function updateTermName(taxIdx, termIdx, val) { globalData[taxIdx].list[termIdx].term = val; markDirty(); render(); }
        function updateLink(taxIdx, termIdx, linkIdx, key, val) {
            if (termIdx === null) globalData[taxIdx].links[linkIdx][key] = val;
            else globalData[taxIdx].list[termIdx].links[linkIdx][key] = val;
            markDirty();
        }
        function addLink(taxIdx, termIdx) {
            const newLink = { title: '', url: '', description: '' };
            if (termIdx === null) {
                if(!globalData[taxIdx].links) globalData[taxIdx].links = [];
                globalData[taxIdx].links.push(newLink);
            } else {
                if(!globalData[taxIdx].list[termIdx].links) globalData[taxIdx].list[termIdx].links = [];
                globalData[taxIdx].list[termIdx].links.push(newLink);
            }
            markDirty();
            render();
        }
        function delLink(taxIdx, termIdx, linkIdx) {
            if(!confirm('确定删除此链接？')) return;
            if (termIdx === null) globalData[taxIdx].links.splice(linkIdx, 1);
            else globalData[taxIdx].list[termIdx].links.splice(linkIdx, 1);
            markDirty();
            render();
        }
        function addNewTaxonomy() {
            globalData.unshift({ taxonomy: 'New Category', icon: 'fa-star', links: [] });
            markDirty();
            render();
        }
        function delTax(idx) {
            if(!confirm('危险：删除分类会清空下面的所有链接！')) return;
            globalData.splice(idx, 1);
            markDirty();
            render();
        }
        function addTerm(taxIdx) {
            if(!globalData[taxIdx].list) globalData[taxIdx].list = [];
            globalData[taxIdx].list.push({ term: 'New Sub-Category', links: [] });
            markDirty();
            render();
        }
        function delTerm(taxIdx, termIdx) {
            if(!confirm('确定删除此子分类？')) return;
            globalData[taxIdx].list.splice(termIdx, 1);
            markDirty();
            render();
        }
        function initLinksMode(taxIdx) { globalData[taxIdx].links = []; markDirty(); render(); }
        function initListMode(taxIdx) { globalData[taxIdx].list = []; markDirty(); render(); }

        // 🆕 保存函数 (发送 currentFileKey)
        function saveData() {
            const fileName = currentFileKey === 'cn' ? 'webstack.yml' : 'en.md';
            if (!dirty && !isSnapshotDirty()) {
                alert('当前没有未保存修改。');
                return;
            }
            const saveButton = document.getElementById('saveButton');
            if (saveButton) {
                saveButton.disabled = true;
                saveButton.textContent = '⏳ 保存中...';
            }
            
            fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fileKey: currentFileKey,
                    data: globalData // 这里发送的永远是数组
                })
            })
            .then(res => {
                if (!res.ok) {
                    return res.json().then((payload) => {
                        throw new Error(payload?.error || `保存失败 (${res.status})`);
                    }).catch(() => {
                        throw new Error(`保存失败 (${res.status})`);
                    });
                }
                return res.json();
            })
            .then(res => {
                if(res.success) {
                    syncSnapshot();
                    if (res.count) {
                        const label = currentFileKey === 'cn' ? 'CN' : 'EN';
                        document.getElementById('countBadge').innerHTML = `链接：<strong>${res.count}</strong>`;
                        document.getElementById('fileBadge').innerHTML = `当前文件：<strong>${label}</strong>`;
                    }
                    alert(`✅ 保存成功！${fileName} 已更新。`);
                }
                else alert('保存失败: ' + res.error);
            })
            .catch(err => alert('保存请求出错: ' + err.message))
            .finally(() => {
                if (saveButton) {
                    saveButton.disabled = false;
                    saveButton.textContent = dirty ? '💾 保存*' : '💾 保存';
                }
            });
        }
    </script>
</body>
</html>
